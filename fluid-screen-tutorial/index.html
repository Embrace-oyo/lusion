<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>屏幕流体特效 — 教程源码</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #141515;
        overflow: hidden;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      .hint {
        position: fixed;
        left: 50%;
        bottom: 26px;
        z-index: 10;
        margin: 0;
        transform: translateX(-50%);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        font-size: 12px;
        letter-spacing: 0.04em;
        color: rgba(30, 30, 34, 0.55);
        pointer-events: none;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <!-- 特效挂载点：FluidExperience.mount() 会在这里插入 canvas -->
    <div id="app"></div>
    <p class="hint">移动鼠标，在画面上涂抹流体</p>

    <script type="module" src="/main.js"></script>
  </body>
</html>
